<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>طلاب حاسبات</title><style>
:root{--primary:#2563eb;--accent:#7c3aed;--bg:#f6f8fc;--card:#fff;--text:#172033;--muted:#667085;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.nav{max-width:1150px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brandMark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center}.wrap{max-width:1150px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:28px;padding:32px 22px;margin:18px 0;box-shadow:0 20px 45px #2563eb2a}.hero h1{font-size:clamp(30px,7vw,54px);margin:0 0 8px}.hero p{margin:0;opacity:.9;max-width:700px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 25px #10182808}.action{min-height:120px;text-align:right;transition:.2s}.action:hover{transform:translateY(-2px)}.btn{padding:11px 15px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700}.btn.alt{background:#eef2ff;color:#3730a3}.btn.danger{background:#dc2626}.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.cover{width:100%;height:190px;object-fit:cover;border-radius:16px;background:#eef2f7}.project h2{margin:8px 0}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:13px;margin:3px}.section{margin-top:18px}.section h3{margin-bottom:7px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.gallery img{width:100%;height:120px;object-fit:cover;border-radius:12px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#111}.field{display:grid;gap:6px;margin:10px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:none}.field textarea{min-height:110px;resize:vertical}.modal{position:fixed;inset:0;background:#0b102055;display:grid;place-items:center;padding:14px;z-index:50}.modalBox{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px}.toast{position:fixed;bottom:18px;left:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:100;display:none}.chat{display:grid;grid-template-columns:260px 1fr;min-height:65vh}.chatList{border-left:1px solid var(--border);padding:10px}.chatMain{display:flex;flex-direction:column;min-height:65vh}.msgs{flex:1;overflow:auto;padding:14px;background:#f8fafc}.bubble{max-width:80%;padding:10px 12px;border-radius:14px;margin:6px 0;background:#fff;border:1px solid var(--border)}.mine{margin-right:auto;background:#e0e7ff;border-color:#c7d2fe}.chatInput{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}@media(max-width:700px){.chat{grid-template-columns:1fr}.chatList{border-left:0;border-bottom:1px solid var(--border);max-height:150px;overflow:auto}.hero{padding:24px 18px}.nav{padding:10px 12px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s), app=$('#app'); let site={},projects=[],adminToken=sessionStorage.adminToken||'',studentToken=sessionStorage.studentToken||'',currentConv=null,ws=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
async function api(path,opt={}){const h=opt.body instanceof FormData?{}:{'content-type':'application/json'};const token=adminToken||studentToken;if(token)h.authorization='Bearer '+token;const r=await fetch(path,{...opt,headers:{...h,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
function connectWS(){try{ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{const m=JSON.parse(e.data);if(['project_created','project_updated','project_deleted','branding_updated'].includes(m.event)){load();if(m.event==='branding_updated'){site=m.data;renderHome()}}if(m.event==='message_created'&&currentConv===m.data.conversation_id)loadMessages(currentConv)}}catch{}}
async function load(){try{site=await api('/api/site');projects=await api('/api/projects');if(!document.querySelector('.hero'))renderHome()}catch(e){app.innerHTML='<div class="wrap"><div class="card"><h2>تعذر تحميل الموقع</h2><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="load()">إعادة المحاولة</button></div></div>'}}
function shell(content){return `<header class="top"><div class="nav"><div class="brand">${site.logo?`<img src="${esc(site.logo)}">`:'<div class="brandMark">ح</div>'}<span>${esc(site.name||'طلاب حاسبات')}</span></div><div class="row"><button class="btn ghost" onclick="renderHome()">الرئيسية</button></div></div></header><main class="wrap">${content}</main>`}
function renderHome(){app.innerHTML=shell(`<section class="hero"><h1>${esc(site.name||'طلاب حاسبات')}</h1><p>${esc(site.subtitle||'عرض مشروعات الطلاب والتواصل بينهم')}</p></section><div class="grid"><button class="card action" onclick="renderProjects()"><h2>📚 المشروعات</h2><p class="muted">تصفح مشروعات الطلاب بالتفاصيل والصور والفيديوهات.</p></button><button class="card action" onclick="renderControl()"><h2>⚙️ الكونترول</h2><p class="muted">إدارة المشروعات والموقع والمحتوى.</p></button><button class="card action" onclick="renderCommunity()"><h2>💬 تواصل مع الطلاب</h2><p class="muted">حسابات ومحادثات خاصة بين الطلاب.</p></button></div>`)}
function renderProjects(){app.innerHTML=shell(`<div class="row" style="justify-content:space-between"><div><h1>المشروعات</h1><p class="muted">${projects.length} مشروع</p></div><button class="btn" onclick="renderHome()">رجوع</button></div><div class="grid">${projects.length?projects.map(p=>`<article class="card project"><img class="cover" src="${esc(p.cover_url||'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=800 height=400><rect width=100% height=100% fill=\'%23e5e7eb\'/><text x=50% y=50% dominant-baseline=middle text-anchor=middle fill=\'%23667085\' font-size=28>مشروع طلابي</text></svg>')}"><h2>${esc(p.name)}</h2><div>${p.level?`<span class="tag">${esc(p.level)}</span>`:''}${p.department?`<span class="tag">${esc(p.department)}</span>`:''}</div><button class="btn" onclick="viewProject('${p.id}')">عرض المشروع</button></article>`).join(''):'<div class="card"><h3>لا توجد مشروعات مضافة حتى الآن.</h3></div>'}</div>`)}
function viewProject(id){const p=projects.find(x=>x.id===id);if(!p)return;app.innerHTML=shell(`<button class="btn ghost" onclick="renderProjects()">← المشروعات</button><article class="card project" style="margin-top:12px"><img class="cover" src="${esc(p.cover_url||'')}"><h1>${esc(p.name)}</h1><div>${p.level?`<span class="tag">${esc(p.level)}</span>`:''}${p.department?`<span class="tag">${esc(p.department)}</span>`:''}</div>${p.sections.map(s=>`<section class="section"><h3>${esc(s.title)}</h3><div>${esc(s.body).replace(/\n/g,'<br>')}</div></section>`).join('')}${p.images.length?`<section class="section"><h3>الصور</h3><div class="gallery">${p.images.map(i=>`<img src="${esc(i.url)}" alt="${esc(i.title)}">`).join('')}</div></section>`:''}${p.videos.length?`<section class="section"><h3>الفيديوهات</h3>${p.videos.map(v=>video(v)).join('<div style="height:10px"></div>')}</section>`:''}</article>`)}
function video(v){if(v.type==='upload')return `<video class="video" controls src="${esc(v.url)}"></video>`;let u=v.url;let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);if(m)u='https://www.youtube.com/embed/'+m[1];return `<iframe class="video" src="${esc(u)}" allowfullscreen loading="lazy"></iframe>`}
function renderControl(){if(adminToken){renderAdmin();return}app.innerHTML=shell(`<div class="card" style="max-width:520px;margin:auto"><h1>دخول الكونترول</h1><div class="field"><label>اسم المستخدم</label><input id="au"></div><div class="field"><label>كلمة المرور</label><input id="ap" type="password"></div><button class="btn" onclick="adminLogin()">دخول</button></div>`)}
async function adminLogin(){try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#au').value,password:$('#ap').value})});adminToken=d.token;sessionStorage.adminToken=adminToken;renderAdmin()}catch(e){toast(e.message)}}
function renderAdmin(){app.innerHTML=shell(`<div class="row" style="justify-content:space-between"><h1>الكونترول</h1><button class="btn danger" onclick="adminLogout()">خروج</button></div><div class="grid"><div class="card"><h2>إضافة مشروع</h2><div class="field"><label>اسم المشروع</label><input id="pn"></div><div class="field"><label>المستوى</label><input id="pl"></div><div class="field"><label>المركز / القسم</label><input id="pd"></div><div class="field"><label>رابط صورة الغلاف</label><input id="pc"></div><div id="imgs"></div><button class="btn alt" onclick="addImageField()">+ صورة</button><div id="vids"></div><button class="btn alt" onclick="addVideoField()">+ فيديو</button><div id="secs"></div><button class="btn alt" onclick="addSectionField()">+ قسم نصي</button><br><br><button class="btn" onclick="createProject()">حفظ المشروع</button></div><div class="card"><h2>إدارة المشروعات</h2>${projects.map(p=>`<div class="card" style="margin:8px 0"><b>${esc(p.name)}</b><div class="row" style="margin-top:8px"><button class="btn ghost" onclick="editProject('${p.id}')">تعديل</button><button class="btn danger" onclick="deleteProject('${p.id}')">حذف</button></div></div>`).join('')}</div><div class="card"><h2>إعدادات الموقع</h2><div class="field"><label>اسم الموقع</label><input id="sn" value="${esc(site.name||'')}"></div><div class="field"><label>الوصف</label><input id="ss" value="${esc(site.subtitle||'')}"></div><div class="field"><label>الشعار (رابط)</label><input id="sl" value="${esc(site.logo||'')}"></div><button class="btn" onclick="saveSettings()">حفظ</button></div><div class="card"><h2>بيانات الكونترول</h2><div class="field"><label>اسم المستخدم الجديد</label><input id="cu"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="cp" type="password"></div><button class="btn" onclick="saveCreds()">تغيير البيانات</button></div></div>`)}
function addImageField(v=''){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="field"><label>رابط الصورة</label><input class="imgUrl" value="${esc(v)}"></div>`;$('#imgs').appendChild(d)}
function addVideoField(v='',type='external'){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="field"><label>رابط الفيديو</label><input class="vidUrl" value="${esc(v)}"></div><div class="field"><select class="vidType"><option value="external" ${type==='external'?'selected':''}>رابط / YouTube</option><option value="upload" ${type==='upload'?'selected':''}>فيديو مرفوع</option></select></div>`;$('#vids').appendChild(d)}
function addSectionField(t='',b=''){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="field"><label>عنوان القسم</label><input class="secTitle" value="${esc(t)}"></div><div class="field"><label>النص</label><textarea class="secBody">${esc(b)}</textarea></div>`;$('#secs').appendChild(d)}
function collect(){return {name:$('#pn').value,level:$('#pl').value,department:$('#pd').value,coverUrl:$('#pc').value,images:[...document.querySelectorAll('.imgUrl')].map(x=>({url:x.value})).filter(x=>x.url),videos:[...document.querySelectorAll('.vidUrl')].map((x,i)=>({url:x.value,type:document.querySelectorAll('.vidType')[i].value})).filter(x=>x.url),sections:[...document.querySelectorAll('.secTitle')].map((x,i)=>({title:x.value,body:document.querySelectorAll('.secBody')[i].value})).filter(x=>x.title||x.body)}}
async function createProject(){try{await api('/api/projects',{method:'POST',body:JSON.stringify(collect())});toast('تم حفظ المشروع');await load();renderAdmin()}catch(e){toast(e.message)}}
async function deleteProject(id){if(!confirm('حذف المشروع نهائيًا؟'))return;try{await api('/api/projects/'+id,{method:'DELETE'});await load();renderAdmin();toast('تم الحذف نهائيًا')}catch(e){toast(e.message)}}
function editProject(id){const p=projects.find(x=>x.id===id);renderAdmin();setTimeout(()=>{['pn','pl','pd','pc'].forEach((id,i)=>document.getElementById(id).value=[p.name,p.level,p.department,p.cover_url][i]);p.images.forEach(x=>addImageField(x.url));p.videos.forEach(x=>addVideoField(x.url,x.type));p.sections.forEach(x=>addSectionField(x.title,x.body));const b=document.querySelector('#pn').parentElement.parentElement.parentElement.querySelector('.btn');b.textContent='تحديث المشروع';b.onclick=async()=>{try{await api('/api/projects/'+p.id,{method:'PATCH',body:JSON.stringify(collect())});await load();renderAdmin();toast('تم التحديث')}catch(e){toast(e.message)}}},30)}
async function saveSettings(){try{site=await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({...site,name:$('#sn').value,subtitle:$('#ss').value,logo:$('#sl').value})});toast('تم حفظ الإعدادات');renderAdmin()}catch(e){toast(e.message)}}
async function saveCreds(){try{await api('/api/admin/credentials',{method:'PATCH',body:JSON.stringify({username:$('#cu').value,password:$('#cp').value})});toast('تم تغيير بيانات الكونترول');}catch(e){toast(e.message)}}
function adminLogout(){adminToken='';sessionStorage.removeItem('adminToken');renderHome()}
function renderCommunity(){if(!studentToken){app.innerHTML=shell(`<div class="grid"><div class="card"><h1>إنشاء حساب</h1><div class="field"><label>الاسم</label><input id="rn"></div><div class="field"><label>اسم المستخدم</label><input id="ru"></div><div class="field"><label>كلمة المرور</label><input id="rp" type="password"></div><button class="btn" onclick="register()">إنشاء الحساب</button></div><div class="card"><h1>تسجيل الدخول</h1><div class="field"><label>اسم المستخدم</label><input id="lu"></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password"></div><button class="btn" onclick="studentLogin()">دخول</button></div></div>`);return}renderChat()}
async function register(){try{await api('/api/students/register',{method:'POST',body:JSON.stringify({displayName:$('#rn').value,username:$('#ru').value,password:$('#rp').value})});toast('تم إنشاء الحساب، يمكنك تسجيل الدخول');}catch(e){toast(e.message)}}
async function studentLogin(){try{const d=await api('/api/students/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});studentToken=d.token;sessionStorage.studentToken=studentToken;renderChat()}catch(e){toast(e.message)}}
async function renderChat(){let cs=[];try{cs=await api('/api/conversations')}catch(e){toast(e.message)}app.innerHTML=shell(`<div class="row" style="justify-content:space-between"><h1>تواصل مع الطلاب</h1><button class="btn danger" onclick="studentLogout()">خروج</button></div><div class="chat card"><aside class="chatList"><div class="field"><input id="target" placeholder="اسم مستخدم طالب"></div><button class="btn" onclick="newConv()">بدء محادثة</button><hr>${cs.map(c=>`<button class="card" style="width:100%;text-align:right;margin:5px 0" onclick="openConv('${c.id}')">${esc(c.members.map(m=>m.display_name).join('، '))}<br><small class="muted">${esc(c.last?.body||'لا توجد رسائل')}</small></button>`).join('')}</aside><section class="chatMain"><div id="msgs" class="msgs"><p class="muted">اختر محادثة أو ابدأ محادثة جديدة.</p></div><div class="chatInput"><input id="msg" placeholder="اكتب رسالتك..." style="flex:1;padding:12px;border:1px solid var(--border);border-radius:12px"><button class="btn" onclick="sendMsg()">إرسال</button></div></section></div>`)}
async function newConv(){try{const d=await api('/api/conversations',{method:'POST',body:JSON.stringify({username:$('#target').value})});currentConv=d.id;await renderChat();await openConv(currentConv)}catch(e){toast(e.message)}}
async function openConv(id){currentConv=id;await loadMessages(id)}
async function loadMessages(id){try{const ms=await api('/api/conversations/'+id);$('#msgs').innerHTML=ms.map(m=>`<div class="bubble ${m.sender_id?'':''}"><b>${esc(m.display_name)}</b><div>${esc(m.body)}</div><small class="muted">${new Date(m.created_at).toLocaleString('ar-EG')}</small></div>`).join('');$('#msgs').scrollTop=$('#msgs').scrollHeight}catch(e){toast(e.message)}}
async function sendMsg(){if(!currentConv)return toast('اختر محادثة أولًا');const v=$('#msg').value.trim();if(!v)return;try{$('#msg').value='';await api('/api/conversations/'+currentConv,{method:'POST',body:JSON.stringify({body:v})});await loadMessages(currentConv)}catch(e){toast(e.message)}}
function studentLogout(){studentToken='';sessionStorage.removeItem('studentToken');renderHome()}
load();connectWS();
</script></body></html>
